%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t8010-pdm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8010 PDM microphone controller

maintainers:
  - Henrik Klee <henrik@goat-code.com>

description: |
  The T8010 PDM controller receives two microphones through separate HP
  decimators. Calibration is forwarded from the live Apple device tree by
  the bootloader. Only the intersection of the controller destination rates
  and both coefficient providers' microphone rates is forwarded. The two
  decimators must have the same rate set and PDM frequency for each rate.
  No calibration blobs or inferred clock frequencies belong in static DTS.
  A clock provider must establish firmware ownership before enabling PDM.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: apple,t8010-pdm
  reg:
    items:
      - description: PDM controller registers
      - description: Decimator 0 registers and coefficient RAM
      - description: Decimator 1 registers and coefficient RAM
  reg-names:
    items:
      - const: pdmc
      - const: decimator0
      - const: decimator1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: pdm
  power-domains:
    maxItems: 1
  dmas:
    maxItems: 1
  dma-names:
    const: rx
  '#sound-dai-cells':
    const: 0
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0

patternProperties:
  '^decimator@[01]$':
    type: object
    additionalProperties: false
    properties:
      reg:
        description: Logical decimator index, not a physical address.
        enum: [0, 1]
      apple,config:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Original decimator configuration word; low byte bits 0 and 4 select inputs.
      apple,mic-name:
        $ref: /schemas/types.yaml#/definitions/uint8-array
        description: Four raw bytes of the original microphone fourcc; not a string or cell.
        minItems: 4
        maxItems: 4
      apple,startup-delay-ms:
        description: Initial capture discard duration in milliseconds, not a sleep with RX disabled.
        maximum: 1000
      apple,force-clock-gating:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [0, 1]
        description: Preserve the original forced decimator gating policy.
    patternProperties:
      '^filter-[1-9][0-9]*$':
        type: object
        additionalProperties: false
        properties:
          sample-rate:
            $ref: /schemas/types.yaml#/definitions/uint32
            minimum: 1
            maximum: 192000
          apple,pdm-frequency:
            $ref: /schemas/types.yaml#/definitions/uint32
            minimum: 1
            description: Exact clock frequency, not sample rate multiplied by decimation ratios.
          apple,latency:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: Original per-rate filter latency, separate from startup delay.
          apple,ratios:
            $ref: /schemas/types.yaml#/definitions/uint8-array
            minItems: 3
            maxItems: 3
            items:
              minimum: 1
              maximum: 63
            description: Three stage ratios in source order; product must not exceed 256.
          apple,lengths:
            $ref: /schemas/types.yaml#/definitions/uint8-array
            minItems: 3
            maxItems: 3
            items:
              minimum: 1
            description: Three stage lengths in source order.
          apple,coefficients:
            $ref: /schemas/types.yaml#/definitions/uint8-array
            minItems: 24
            maxItems: 6120
            description: |
              Raw little-endian 32-bit coefficient words, not big-endian DT
              cells. Exactly eight times the sum of the three lengths in
              bytes. Upload starts at offset 0x1000 and must fit the resource.
        required:
          - sample-rate
          - apple,pdm-frequency
          - apple,latency
          - apple,ratios
          - apple,lengths
          - apple,coefficients
    required:
      - reg
      - apple,config
      - apple,mic-name
      - apple,startup-delay-ms
      - apple,force-clock-gating

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - dmas
  - dma-names
  - '#sound-dai-cells'
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false
