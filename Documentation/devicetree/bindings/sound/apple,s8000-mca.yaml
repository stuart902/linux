%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,s8000-mca.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S8000/T8010 MCA I2S controller

maintainers:
  - Berkay Kösebay <brkosebay@users.noreply.github.com>

description: |
  The "mca-version 4" serializer of the Apple A9. Each MCA has a register
  window and a 32-bit MCLK control word, which the driver exports as the
  clock feeding the codec's MCLK. Its pads are connected to the outside
  through the i2s-switch, a routing block shared by all MCAs. Samples are
  moved by SmartIO DMA. T8010 uses the same register layout (version 5),
  with an AP NCO bitclock for the playback-only digital speaker path.

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          const: apple,t8010-mca
    then:
      properties:
        dmas:
          maxItems: 1
        dma-names:
          maxItems: 1
      required:
        - clocks
        - clock-names
    else:
      properties:
        clocks: false
        clock-names: false

properties:
  compatible:
    enum:
      - apple,s8000-mca
      - apple,t8010-mca

  clocks:
    maxItems: 1
    description: AP NCO channel supplying the T8010 bitclock

  clock-names:
    const: bitclk

  reg:
    items:
      - description: MCA registers
      - description: MCLK control word

  reg-names:
    items:
      - const: mca
      - const: mclk

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  dmas:
    minItems: 1
    items:
      - description: SmartIO transmit (playback) endpoint
      - description: SmartIO receive (capture) endpoint

  dma-names:
    minItems: 1
    items:
      - const: tx
      - const: rx

  '#sound-dai-cells':
    const: 0

  '#clock-cells':
    const: 0

  clock-output-names:
    maxItems: 1

  apple,i2s-switch:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle of the i2s-switch syscon
          - description: index of this MCA's node in the switch (audN)
            maximum: 4
          - description: index of the pad the codec is wired to (pinN)
            maximum: 4
    description:
      The i2s-switch route between this MCA and the pad its codec is
      connected to. The route is programmed while a stream is prepared.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - dmas
  - dma-names
  - '#sound-dai-cells'
  - '#clock-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      i2s_switch: syscon@20a003000 {
        compatible = "apple,s8000-i2s-switch", "syscon";
        reg = <0x2 0x0a003000 0x0 0x1000>;
      };

      mca@20a0a0000 {
        compatible = "apple,s8000-mca";
        reg = <0x2 0x0a0a0000 0x0 0x4000>,
              <0x2 0x0a002000 0x0 0x4>;
        reg-names = "mca", "mclk";
        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 201 IRQ_TYPE_LEVEL_HIGH>;
        power-domains = <&ps_mca0>;
        dmas = <&sio 0x28>, <&sio 0x29>;
        dma-names = "tx", "rx";
        apple,i2s-switch = <&i2s_switch 0 0>;
        #clock-cells = <0>;
        clock-output-names = "mca0-mclk";
        #sound-dai-cells = <0>;
      };
    };
