%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/apple,dart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DART IOMMU

maintainers:
  - Sven Peter <sven@svenpeter.dev>

description: |+
  Apple SoCs may contain an implementation of their Device Address
  Resolution Table which provides a mandatory layer of address
  translations for various masters.

  Each DART instance is capable of handling up to 16 different streams
  with individual pagetables and page-level read/write protection flags.

  This DART IOMMU also raises interrupts in response to various
  fault conditions.

properties:
  compatible:
    oneOf:
      - enum:
          - apple,s5l8960x-dart
          - apple,t8103-dart
          - apple,t8103-usb4-dart
          - apple,t8110-dart
          - apple,t6000-dart
      - items:
          - const: apple,t6020-dart
          - const: apple,t8110-dart
      - items:
          - enum:
              - apple,t7000-dart
              - apple,s8000-dart
              - apple,t8010-dart
          - const: apple,s5l8960x-dart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    description:
      Reference to the gate clock phandle if required for this IOMMU.
      Optional since not all IOMMUs are attached to a clock gate.

  '#iommu-cells':
    enum: [ 1, 5 ]
    description:
      Has to be one or five. The first cell describes the stream id emitted by
      a master to the IOMMU. The optional second and third cell describe the
      aperture start of a master's DMA window and fourth and fifth cell describe
      the size of DMA window.

  power-domains:
    maxItems: 1

  apple,error-reflector:
    $ref: /schemas/types.yaml#/definitions/uint64
    description:
      Physical address of the page that faulting transactions are redirected
      to, so that they complete instead of stalling the master. From the
      Apple device tree property "error-reflector" of the same DART.

  apple,fetch-config:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Value of the table fetch configuration register, from the Apple device
      tree property "fetch-config" of the same DART.

  apple,diag-config:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Value of the diagnostic configuration register, from the Apple device
      tree property "diag-config" of the same DART.

required:
  - compatible
  - reg
  - '#iommu-cells'
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          not:
            contains:
              const: apple,s5l8960x-dart
    then:
      properties:
        apple,error-reflector: false
        apple,fetch-config: false
        apple,diag-config: false

additionalProperties: false

examples:
  - |+
    dart1: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <5>;
    };

    master1 {
      iommus = <&dart1 0 0x100 0x0 0x10 0x0>;
    };

  - |+
    dart2a: iommu@82f00000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f00000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };
    dart2b: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };

    master2 {
      iommus = <&dart2a 0>, <&dart2b 1>;
    };

  - |+
    dart3: iommu@1008000 {
      compatible = "apple,s8000-dart", "apple,s5l8960x-dart";
      reg = <0x1008000 0x4000>;
      interrupts = <1 245 4>;
      #iommu-cells = <5>;
      apple,error-reflector = /bits/ 64 <0x20fffc000>;
      apple,fetch-config = <0x000e0303>;
      apple,diag-config = <0x00000100>;
    };
