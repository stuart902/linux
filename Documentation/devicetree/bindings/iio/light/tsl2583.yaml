%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/tsl2583.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMS/TAOS Ambient Light Sensor (ALS)

maintainers:
  - Brian Masney <masneyb@onstation.org>

description: |
  Ambient light sensing with an i2c interface. The Apple CT819 and CT821
  factory calibration is stored in SysCfg. Boot firmware either copies the
  resolved record into apple,als-calibration or, where it creates the SysCfg
  NVMEM provider, adds both NVMEM properties before kernel handoff. The
  static board tree carries neither.

properties:
  compatible:
    oneOf:
      - enum:
          - amstaos,tsl2580
          - amstaos,tsl2581
          - amstaos,tsl2583
      - items:
          - enum:
              - apple,ct819
              - apple,ct821
          - const: amstaos,tsl2581

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vcc-supply:
    description: Regulator that provides power to the sensor

  apple,als-calibration:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 8
    maxItems: 1024
    description:
      Apple factory LSCI ambient-light calibration record, the raw bytes of
      the ADT alsCalibration property as resolved by iBoot. Used instead of
      nvmem-cells when present.

  nvmem-cells:
    description:
      Apple factory LSCI ambient-light calibration data. Boot firmware must
      populate this together with nvmem-cell-names when the provider is not
      statically representable.
    maxItems: 1

  nvmem-cell-names:
    items:
      - const: calibration

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,ct819
              - apple,ct821
    then:
      dependentRequired:
        nvmem-cells:
          - nvmem-cell-names
        nvmem-cell-names:
          - nvmem-cells
    else:
      properties:
        apple,als-calibration: false
        nvmem-cells: false
        nvmem-cell-names: false

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@29 {
            compatible = "apple,ct821", "amstaos,tsl2581";
            reg = <0x29>;
            nvmem-cells = <&als_calibration>;
            nvmem-cell-names = "calibration";
        };
    };
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "apple,ct819", "amstaos,tsl2581";
            reg = <0x39>;
            /* Copied by the bootloader from the ADT; header only here */
            apple,als-calibration = [00 02 01 08 48 00 a2 f8];
        };
    };
...
